<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2b4fb0">
    <title>Chore Slayer Admin</title>
    <link rel="stylesheet" href="assets/styles.css?v=12">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg?v=2">
    <style>
        .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        .admin-table caption { text-align: left; font-weight: 700; padding: 8px 0; }
        .admin-table th, .admin-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #d9dce3; vertical-align: top; }
        .admin-table th[scope="col"] { background: #f1f3f8; }
        .admin-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .admin-actions { display: flex; flex-wrap: wrap; gap: 6px; }
        .admin-code { font-family: ui-monospace, Menlo, monospace; font-weight: 700; letter-spacing: 0.04em; }
        .admin-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 12px 0; }
        .admin-toolbar .field { margin: 0; min-width: 240px; }
        dialog.admin-dialog { border: 0; border-radius: 14px; padding: 20px; max-width: 460px; width: calc(100% - 32px); }
        dialog.admin-dialog::backdrop { background: rgba(0,0,0,0.45); }
        @media (max-width: 760px) {
            .admin-table thead { position: absolute; left: -9999px; }
            .admin-table tr { display: block; border: 1px solid #d9dce3; border-radius: 12px; margin-bottom: 12px; padding: 4px 8px; }
            .admin-table td, .admin-table th[scope="row"] { display: block; border: 0; padding: 6px 4px; }
            .admin-table td[data-label]::before { content: attr(data-label) ": "; font-weight: 600; }
            .admin-table td.num { text-align: left; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="app-header" role="banner">
        <div class="app-header__inner">
            <img class="app-logo" src="assets/icon.svg?v=2" alt="" width="34" height="34">
            <h1 class="app-title">Chore Slayer Admin</h1>
            <div class="app-header__actions" id="header-actions"></div>
        </div>
    </header>
    <main id="main" tabindex="-1" class="admin-wrap">
        <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
        <div id="toast" class="toast" role="alert" hidden></div>
        <div id="view"></div>
    </main>
    <script src="assets/admin.js?v=1"></script>
</body>
</html>
